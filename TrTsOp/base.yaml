# 模型相关参数
model:
  experiment: 'NCT-CRC-HE-100K-OSR'  #实验名字
comparison:
  method: 'MSP'
  backbone_name: 'convnextv2_tiny'
  
# 组件开关
Ablation:
  STDP: True
  AFD: True

# 数据集相关参数
dataset:
  image_cache_size: 5050 #常用图片加速缓存大小
  data_path: "../data/NCT-CRC-HE-100K-OSR/"  # 数据集路径
  batch_size: 64  # 批量大小
  num_workers: 6  # 数据加载线程数
  img_size: 224   #预处理目标大小
  random_seed: 42

# 预测/测试相关参数
testing:
  test_weights: "../cache/weights/best_NCT-CRC-HE-100K-OSR_STDP.pth"  #所用权重模型
  results_png: '../cache/logs/result_graph' #预测结果保存路径
  device: 'cuda:0'       # 使用的设备 (cuda或cpu)
  test_root: "test" #相对data_path进一层的测试集
  batch_size: 64  # 批量大小
  num_workers: 6  # 数据加载线程数

# 训练相关参数
training:
  aux: 0.2         # 对齐损失的权重
  align: 0.005  # 纹理分类损失相对于结构分类损失的权重
  epochs: 150      # 训练周期数
  learning_rate: 0.0001  # 初始学习率
  weight_decay: 0.05     # 权重衰减系数
  device: 'cuda:0'       # 使用的设备 (cuda或cpu)
  train_root: "train"    #相对data_path进一层的训练集
  val_root: "val"        #如果不设置，则启用val_rate进行切割
  val_rate: 0.20          #验证集大概比例
  amp: True             #混合精度训练
  
log:
  base_dir: '../cache'          # 基础缓存目录
  weights_subdir: 'weights'     # 权重子目录
  logs_subdir: 'logs'           # 日志子目录
  text_logs_subdir: 'text'      # 文本日志子目录
  graph_logs_subdir: 'result_graph' # 日志子目录